name: Credential-free validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-free-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
            git diff --check "${HEAD_SHA}^" "$HEAD_SHA"
          else
            git diff --check
          fi

      - name: Validate checked-in project and asset identity
        run: python3 scripts/ci/validate_repository.py

      - name: Validate clean checkout
        run: python3 scripts/ci/check_clean_checkout.py

      - name: Validate SG-10 build identity and release evidence
        run: python3 scripts/ci/validate_release_evidence.py

      - name: Validate SG-11 playtest evidence schema
        run: python3 scripts/ci/validate_playtest_evidence.py

      - name: Validate SG-12 closeout evidence
        run: python3 scripts/ci/validate_closeout_evidence.py

      - name: Test SG-12 production readback contract
        run: python3 scripts/ci/test_closeout_production_readback.py

      - name: Classify Unity and WebGL execution
        shell: bash
        run: |
          {
            echo "### Unity and WebGL validation"
            echo
            echo "- Unity editor compile, EditMode/PlayMode tests, and WebGL build: **NOT_RUN**"
            echo "- This credential-free workflow does not install or license Unity."
            echo "- Local editor and WebGL evidence is recorded in [docs/sg-09-build-evidence.md](docs/sg-09-build-evidence.md)."
            echo "- Generated artifact hash verification: **NOT_RUN** in this clean checkout; run the release validator with --build-dir locally."
            echo "- Foreground desktop browser, working-set, screen-reader, and human benchmark lanes remain **NOT_RUN**."
            echo "- SG-11 evidence validation checks the protocol only until owner-approved sessions are recorded."
            echo "- SG-12 ownerQualification validation checks the fail-closed state machine only; owner-run evidence and release promotion remain **NOT_READY** pending the runbook gates."
          } >> "$GITHUB_STEP_SUMMARY"
